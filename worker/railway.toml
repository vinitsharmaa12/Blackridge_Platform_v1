# Railway config for the ingestion worker service.
# In the worker service settings, set Config file path to: worker/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "worker/Dockerfile"
watchPatterns = [
  "core/**",
  "worker/**",
  "insights/**",
  "metrics.py",
  "requirements.txt",
  "worker/Dockerfile",
]

[deploy]
startCommand = "python -m worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
