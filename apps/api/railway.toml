# Railway config for the FastAPI service.
# In the api service settings, set Config file path to: apps/api/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "core/**",
  "insights/**",
  "metrics.py",
  "requirements.txt",
  "apps/api/Dockerfile",
]

[deploy]
startCommand = "python -m apps.api"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
